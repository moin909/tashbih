<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f5f2">
<title>Tasbih</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Default seed colour (hue 165). Replaced by colours picked from your tasbih photo. */
    --primary: hsl(165,55%,32%);
    --on-primary: #fff;
    --primary-container: hsl(165,45%,88%);
    --on-primary-container: hsl(165,60%,12%);
    --surface: hsl(165,18%,96%);
    --surface-container: hsl(165,20%,91%);
    --on-surface: hsl(165,15%,10%);
    --on-surface-variant: hsl(165,8%,36%);
    --outline: hsl(165,8%,72%);
    color-scheme: light dark;
  }
  :root[data-dark="true"] { color-scheme: dark; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Roboto Flex", "Google Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--surface);
    color: var(--on-surface);
    transition: background .4s, color .4s;
    overflow: hidden;
  }
  .app {
    height: 100dvh;
    max-width: 560px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* ---------- Top half: tasbih photo ---------- */
  .photo {
    flex: 1 1 50%;
    min-height: 0;
    position: relative;
    border-radius: 36px;
    background: var(--primary-container);
    color: var(--on-primary-container);
    overflow: hidden;
    display: grid;
    place-items: center;
    cursor: pointer;
    border: 0;
    padding: 0;
    font: inherit;
    transition: background .4s;
  }
  .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  .photo.has-img img { display: block; }
  .photo.has-img .empty { display: none; }
  .empty { display: grid; justify-items: center; gap: 10px; padding: 24px; text-align: center; }
  .empty svg { width: 56px; height: 56px; }
  .empty strong { font-size: 1.125rem; font-weight: 500; }
  .empty span { font-size: .875rem; opacity: .75; }
  .photo:focus-visible, .btn:focus-visible, .press:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }

  .top-actions { position: absolute; top: 10px; right: 10px; display: flex; gap: 8px; z-index: 2; }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 50%;
    border: 0; display: grid; place-items: center; cursor: pointer;
    background: color-mix(in srgb, var(--surface) 82%, transparent);
    color: var(--on-surface);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .icon-btn svg { width: 22px; height: 22px; fill: currentColor; }
  .icon-btn:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

  /* ---------- Bottom half: counter + press ---------- */
  .bottom { flex: 1 1 50%; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
  .counter {
    background: var(--surface-container);
    border-radius: 28px;
    padding: 14px 20px 16px;
    display: grid;
    gap: 10px;
    transition: background .4s;
  }
  .counter-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .count {
    font-size: clamp(3rem, 16vw, 4.5rem);
    font-weight: 500;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    font-variation-settings: "opsz" 144;
    letter-spacing: -.02em;
  }
  .count.bump { animation: bump .18s ease-out; }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.08); } 100% { transform: scale(1); } }
  .meta { text-align: right; font-size: .875rem; color: var(--on-surface-variant); line-height: 1.5; }
  .meta b { color: var(--on-surface); font-weight: 500; }
  .progress { height: 8px; border-radius: 4px; background: var(--outline); overflow: hidden; opacity: .9; }
  .progress i { display: block; height: 100%; width: 0; background: var(--primary); border-radius: 4px; transition: width .2s ease, background .4s; }
  .progress.off { display: none; }

  .press {
    flex: 1;
    min-height: 96px;
    border: 0;
    border-radius: 44px;
    background: var(--primary);
    color: var(--on-primary);
    font: inherit;
    font-size: 1.375rem;
    font-weight: 500;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
    transition: transform .12s ease, border-radius .12s ease, background .4s;
  }
  .press:active { transform: scale(.985); border-radius: 36px; }
  .ripple {
    position: absolute; border-radius: 50%; pointer-events: none;
    background: currentColor; opacity: .28; transform: scale(0);
    animation: ripple .55s ease-out forwards;
  }
  @keyframes ripple { to { transform: scale(1); opacity: 0; } }

  /* ---------- Dialogs ---------- */
  dialog {
    border: 0; border-radius: 28px; padding: 24px;
    background: var(--surface); color: var(--on-surface);
    width: min(92vw, 380px);
    box-shadow: 0 12px 40px rgba(0,0,0,.3);
  }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h2 { margin: 0 0 8px; font-size: 1.5rem; font-weight: 500; }
  dialog p { margin: 0 0 16px; color: var(--on-surface-variant); line-height: 1.5; }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
  .btn {
    border: 0; border-radius: 20px; height: 40px; padding: 0 22px;
    font: inherit; font-weight: 500; font-size: .9375rem; cursor: pointer;
  }
  .btn.text { background: transparent; color: var(--primary); }
  .btn.filled { background: var(--primary); color: var(--on-primary); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chip {
    height: 36px; padding: 0 16px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--outline); background: transparent; color: var(--on-surface);
    font: inherit; font-size: .875rem;
  }
  .chip[aria-pressed="true"] { background: var(--primary-container); color: var(--on-primary-container); border-color: transparent; }
  label.field { display: grid; gap: 6px; font-size: .8125rem; color: var(--on-surface-variant); }
  label.field input {
    height: 52px; border-radius: 14px; border: 1px solid var(--outline);
    background: transparent; color: var(--on-surface); padding: 0 16px; font: inherit; font-size: 1rem;
  }
  label.field input:focus { outline: 2px solid var(--primary); border-color: transparent; }
  .switch-row { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; font-size: .9375rem; }
  .switch-row input { width: 20px; height: 20px; accent-color: var(--primary); }

  .done-icon {
    width: 72px; height: 72px; border-radius: 50%; margin: 0 0 16px;
    background: var(--primary-container); color: var(--on-primary-container);
    display: grid; place-items: center;
  }
  .done-icon svg { width: 40px; height: 40px; fill: currentColor; }
  dialog[open] .done-icon { animation: pop .45s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<main class="app">

  <!-- Upper half: your tasbih -->
  <button class="photo" id="photo" aria-label="Upload tasbih photo">
    <img id="photoImg" alt="Your tasbih">
    <div class="empty">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 7v2.99s-1.99.01-2 0V7h-3s.01-1.99 0-2h3V2h2v3h3v2h-3zm-3 4V8h-3V5H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-8h-3zM5 19l3-4 2 3 3-4 4 5H5z"/></svg>
      <strong>Add your tasbih photo</strong>
      <span>Tap to choose an image</span>
    </div>
  </button>
  <input type="file" id="file" accept="image/*" class="sr" tabindex="-1">

  <div class="top-actions">
    <button class="icon-btn" id="openSettings" aria-label="Set count limit">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.74 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.12.22.37.29.61.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.26.42.5.42h3.84c.24 0 .45-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.49 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
    </button>
    <button class="icon-btn" id="openReset" aria-label="Reset counter">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
  </div>

  <!-- Lower half: counter + press button -->
  <section class="bottom">
    <div class="counter">
      <div class="counter-row">
        <div class="count" id="count" aria-live="polite">0</div>
        <div class="meta">
          <div id="limitText">No limit</div>
          <div>Rounds done: <b id="rounds">0</b></div>
        </div>
      </div>
      <div class="progress off" id="progress"><i id="bar"></i></div>
    </div>
    <button class="press" id="press">Tap to count</button>
  </section>
</main>

<!-- Settings -->
<dialog id="settings">
  <h2>Count limit</h2>
  <p>Get a message when you reach your target.</p>
  <div class="chips" id="chips">
    <button class="chip" data-v="0" aria-pressed="false">No limit</button>
    <button class="chip" data-v="33" aria-pressed="false">33</button>
    <button class="chip" data-v="99" aria-pressed="false">99</button>
    <button class="chip" data-v="100" aria-pressed="false">100</button>
    <button class="chip" data-v="313" aria-pressed="false">313</button>
  </div>
  <label class="field">Custom limit
    <input type="number" id="customLimit" inputmode="numeric" min="0" max="100000" placeholder="e.g. 500">
  </label>
  <label class="switch-row"><span>Vibrate on tap</span><input type="checkbox" id="haptics"></label>
  <label class="switch-row"><span>Remove photo</span><button class="btn text" id="removeImg" type="button">Remove</button></label>
  <div class="dlg-actions">
    <button class="btn text" id="cancelSettings">Cancel</button>
    <button class="btn filled" id="saveSettings">Save</button>
  </div>
</dialog>

<!-- Milestone -->
<dialog id="done">
  <div class="done-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></div>
  <h2>Milestone complete</h2>
  <p id="doneText">Congratulations! You completed your count.</p>
  <div class="dlg-actions">
    <button class="btn text" id="keepGoing">Keep counting</button>
    <button class="btn filled" id="nextRound">Start new round</button>
  </div>
</dialog>

<!-- Reset -->
<dialog id="reset">
  <h2>Reset counter?</h2>
  <p>This sets the count and rounds back to 0.</p>
  <div class="dlg-actions">
    <button class="btn text" id="cancelReset">Cancel</button>
    <button class="btn filled" id="confirmReset">Reset</button>
  </div>
</dialog>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const KEY = "tasbih-state-v1";
  const state = { count: 0, limit: 0, rounds: 0, haptics: true, image: null };

  // ---------- storage ----------
  try { Object.assign(state, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

  // ---------- Material You colours (Monet-style, seeded from the photo) ----------
  const root = document.documentElement;
  const dark = matchMedia("(prefers-color-scheme: dark)");
  let seed = { h: 165, s: 50 };

  function applyTheme() {
    const { h, s } = seed;
    const set = (k, v) => root.style.setProperty(k, v);
    const sat = Math.max(30, Math.min(65, s));
    let theme;
    if (dark.matches) {
      theme = {
        "--primary": `hsl(${h},${sat}%,75%)`, "--on-primary": `hsl(${h},${sat}%,15%)`,
        "--primary-container": `hsl(${h},${sat * .7}%,26%)`, "--on-primary-container": `hsl(${h},${sat}%,90%)`,
        "--surface": `hsl(${h},12%,9%)`, "--surface-container": `hsl(${h},12%,15%)`,
        "--on-surface": `hsl(${h},10%,90%)`, "--on-surface-variant": `hsl(${h},8%,70%)`, "--outline": `hsl(${h},8%,30%)`
      };
    } else {
      theme = {
        "--primary": `hsl(${h},${sat}%,32%)`, "--on-primary": "#fff",
        "--primary-container": `hsl(${h},${sat * .8}%,88%)`, "--on-primary-container": `hsl(${h},${sat}%,12%)`,
        "--surface": `hsl(${h},18%,96%)`, "--surface-container": `hsl(${h},20%,91%)`,
        "--on-surface": `hsl(${h},15%,10%)`, "--on-surface-variant": `hsl(${h},8%,36%)`, "--outline": `hsl(${h},8%,72%)`
      };
    }
    for (const k in theme) set(k, theme[k]);
    document.querySelector('meta[name="theme-color"]').content = theme["--surface"];
  }
  dark.addEventListener("change", applyTheme);

  function seedFromImage(img) {
    try {
      const c = document.createElement("canvas"); c.width = c.height = 32;
      const g = c.getContext("2d", { willReadFrequently: true });
      g.drawImage(img, 0, 0, 32, 32);
      const d = g.getImageData(0, 0, 32, 32).data;
      // Weight pixels by saturation so vivid beads win over grey backgrounds
      const bins = new Array(36).fill(0);
      let sSum = 0, n = 0;
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i] / 255, gg = d[i+1] / 255, b = d[i+2] / 255;
        const mx = Math.max(r, gg, b), mn = Math.min(r, gg, b), l = (mx + mn) / 2, dl = mx - mn;
        if (dl < .08 || l < .1 || l > .92) continue;
        const sat = dl / (1 - Math.abs(2 * l - 1));
        let h = mx === r ? ((gg - b) / dl) % 6 : mx === gg ? (b - r) / dl + 2 : (r - gg) / dl + 4;
        h = (h * 60 + 360) % 360;
        bins[Math.floor(h / 10)] += sat; sSum += sat; n++;
      }
      if (!n) return;
      const best = bins.indexOf(Math.max(...bins));
      seed = { h: best * 10 + 5, s: Math.round((sSum / n) * 100) };
    } catch (e) {}
  }

  // ---------- image ----------
  function showImage(src) {
    const img = $("photoImg");
    img.onload = () => { seedFromImage(img); applyTheme(); };
    img.src = src;
    $("photo").classList.add("has-img");
  }
  function clearImage() {
    state.image = null;
    $("photoImg").removeAttribute("src");
    $("photo").classList.remove("has-img");
    seed = { h: 165, s: 50 };
    applyTheme(); save();
  }
  $("photo").addEventListener("click", () => $("file").click());
  $("file").addEventListener("change", e => {
    const f = e.target.files[0]; if (!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const max = 1200, k = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement("canvas");
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        state.image = c.toDataURL("image/jpeg", .85);
        showImage(state.image); save();
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(f);
    e.target.value = "";
  });

  // ---------- counter ----------
  function render() {
    $("count").textContent = state.count;
    $("rounds").textContent = state.rounds;
    const has = state.limit > 0;
    $("limitText").textContent = has ? `Limit: ${state.limit}` : "No limit";
    $("progress").classList.toggle("off", !has);
    $("bar").style.width = has ? Math.min(100, state.count / state.limit * 100) + "%" : "0";
  }

  function ripple(e) {
    const b = $("press"), r = b.getBoundingClientRect();
    const size = Math.max(r.width, r.height) * 2;
    const s = document.createElement("span");
    s.className = "ripple";
    s.style.width = s.style.height = size + "px";
    s.style.left = ((e.clientX || r.left + r.width / 2) - r.left - size / 2) + "px";
    s.style.top = ((e.clientY || r.top + r.height / 2) - r.top - size / 2) + "px";
    b.appendChild(s);
    setTimeout(() => s.remove(), 600);
  }

  function press(e) {
    state.count++;
    ripple(e);
    const c = $("count"); c.classList.remove("bump"); void c.offsetWidth; c.classList.add("bump");
    if (state.haptics && navigator.vibrate) navigator.vibrate(state.limit && state.count === state.limit ? [60, 40, 120] : 12);
    render(); save();
    if (state.limit && state.count === state.limit) {
      $("doneText").textContent = `Congratulations! You completed ${state.limit} counts.`;
      $("done").showModal();
    }
  }
  $("press").addEventListener("click", press);

  $("nextRound").onclick = () => { state.rounds++; state.count = 0; render(); save(); $("done").close(); };
  $("keepGoing").onclick = () => { $("done").close(); };

  // ---------- settings ----------
  let pending = 0;
  function syncChips() {
    document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(+c.dataset.v === pending)));
  }
  $("openSettings").onclick = () => {
    pending = state.limit;
    $("customLimit").value = [0, 33, 99, 100, 313].includes(pending) ? "" : pending;
    $("haptics").checked = state.haptics;
    syncChips();
    $("settings").showModal();
  };
  $("chips").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    pending = +b.dataset.v; $("customLimit").value = ""; syncChips();
  });
  $("customLimit").addEventListener("input", e => {
    const v = parseInt(e.target.value, 10);
    pending = Number.isFinite(v) && v > 0 ? v : 0; syncChips();
  });
  $("saveSettings").onclick = () => {
    state.limit = pending;
    state.haptics = $("haptics").checked;
    render(); save(); $("settings").close();
    // If the new limit is already reached, celebrate right away
    if (state.limit && state.count >= state.limit) {
      $("doneText").textContent = `Congratulations! You completed ${state.limit} counts.`;
      $("done").showModal();
    }
  };
  $("cancelSettings").onclick = () => $("settings").close();
  $("removeImg").onclick = () => { clearImage(); $("settings").close(); };

  // ---------- reset ----------
  $("openReset").onclick = () => $("reset").showModal();
  $("cancelReset").onclick = () => $("reset").close();
  $("confirmReset").onclick = () => { state.count = 0; state.rounds = 0; render(); save(); $("reset").close(); };

  // ---------- init ----------
  applyTheme();
  if (state.image) showImage(state.image);
  render();
})();
</script>
</body>
</html>
